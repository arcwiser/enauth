name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reject unresolved merge conflicts
        shell: pwsh
        run: |
          $matches = git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!sdk/json.hpp'
          if ($LASTEXITCODE -eq 0) { Write-Error "Unresolved merge conflict markers found:`n$matches" }
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }

      - name: Compile Python sources
        run: python -m compileall -q main.py database.py routes utils migrations

      - name: Run tests
        run: python -m unittest discover -s tests -v
