<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnAuth — Control Center</title><link rel="stylesheet" href="css/style.css">
<style>
.score{font-size:42px;font-weight:800}.control-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.setting{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.app-row{display:grid;grid-template-columns:minmax(150px,1fr) repeat(4,minmax(80px,.5fr)) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.risk{color:var(--error)}@media(max-width:850px){.app-row{grid-template-columns:1fr 1fr}.app-actions{grid-column:1/-1}}
</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main">
<div class="topbar"><div class="topbar-title">Security Control Center</div><button class="btn btn-outline" onclick="load()">Refresh</button></div>
<main class="content">
<div class="control-grid">
 <div class="card"><div class="stat-label">Security posture</div><div class="score" id="score">—</div><div class="stat-label">Production safeguards enabled</div></div>
 <div class="card"><div class="stat-label">Failed auth · 24h</div><div class="stat-value" id="failed">—</div></div>
 <div class="card"><div class="stat-label">Replay signals · 24h</div><div class="stat-value" id="replays">—</div></div>
 <div class="card"><div class="stat-label">Live download tickets</div><div class="stat-value" id="tickets">—</div></div>
</div>
<div class="card" style="margin-top:18px"><div class="card-header"><div class="card-title">Production safeguards</div></div><div id="settings"></div></div>
<div class="card" style="margin-top:18px"><div class="card-header"><div class="card-title">Application controls</div></div><div id="apps"></div></div>
<div class="card" style="margin-top:18px"><div class="card-header"><div class="card-title">Recent security events</div></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>App</th><th>Event</th><th>IP</th><th>Details</th></tr></thead><tbody id="events"></tbody></table></div></div>
</main></div></div><script src="js/api.js"></script><script>
requireAuth();buildSidebar("control");let data=null;
const names={secure_cookies:"Secure cookies",cors_restricted:"Restricted CORS",debug_disabled:"Production mode",license_pepper_configured:"License-key pepper",legacy_protocol_disabled:"Legacy protocol disabled",backup_encryption_configured:"Encrypted signing-key backups",automatic_backups_enabled:"Automatic backups"};
async function load(){try{data=await API.getControlCenter();score.textContent=data.security_score+"%";score.className="score "+(data.security_score<80?"risk":"");failed.textContent=data.events_24h.failed_auth;replays.textContent=data.events_24h.replay;tickets.textContent=data.outstanding_download_tickets;settings.innerHTML=Object.entries(data.security_settings).map(([k,v])=>`<div class="setting"><span>${escapeHtml(names[k]||k)}</span>${statusBadge(v?'active':'banned')}</div>`).join("");apps.innerHTML=data.applications.map(a=>`<div class="app-row"><div><strong>${escapeHtml(a.name)}</strong><div class="mono" style="font-size:11px;color:var(--text3)">${escapeHtml(a.id)}</div></div><div><small>Licenses</small><br>${a.licenses}</div><div><small>Sessions</small><br>${a.active_sessions}</div><div><small>Revoked builds</small><br>${a.revoked_builds}</div><div>${statusBadge(a.is_paused?'paused':(a.service_status||'active'))}</div><div class="app-actions"><button class="btn btn-outline btn-sm" data-action="revoke" data-app="${escapeHtml(a.id)}">Revoke sessions</button> <button class="btn btn-danger btn-sm" data-action="lockdown" data-app="${escapeHtml(a.id)}">Lockdown</button></div></div>`).join("")||'<div class="empty"><div class="empty-text">No applications</div></div>';events.innerHTML=data.recent_security_events.map(e=>`<tr><td>${fmtDate(e.timestamp)}</td><td class="mono">${escapeHtml(e.app_id||'—')}</td><td>${escapeHtml(e.action)}</td><td class="mono">${escapeHtml(e.ip||'—')}</td><td>${escapeHtml(e.details||'')}</td></tr>`).join("")||'<tr><td colspan="5">No recent security events.</td></tr>'}catch(e){toast(e.message,"error")}}
async function revoke(appId){const reason=prompt("Reason for revoking every active session for this app:","Security maintenance");if(!reason)return;try{const r=await API.revokeScopedSessions({app_id:appId,reason});toast(`Revoked ${r.revoked_sessions} session(s)`,"warning");load()}catch(e){toast(e.message,"error")}}
async function lockdown(appId){const app=data.applications.find(a=>a.id===appId);const reason=prompt(`Emergency reason for taking ${app?.name||'this app'} offline:`);if(!reason)return;const confirmation=prompt(`This pauses authentication and invalidates sessions/download tickets. Type: LOCK ${appId}`);if(!confirmation)return;try{const r=await API.emergencyLockdown(appId,{reason,confirmation});toast(`Application locked; ${r.revoked_sessions} sessions revoked`,"warning");load()}catch(e){toast(e.message,"error")}}
apps.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;button.dataset.action==='revoke'?revoke(button.dataset.app):lockdown(button.dataset.app)});
load();setInterval(load,30000);
</script></body></html>
