<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Status</title><link rel="stylesheet" href="css/style.css">
<style>
body{min-height:100vh;background:var(--bg);padding:40px 16px}.status-wrap{max-width:850px;margin:auto}.status-head{text-align:center;margin-bottom:28px}.service{display:flex;justify-content:space-between;gap:18px;padding:18px;border-bottom:1px solid var(--border)}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.operational{background:var(--accent-green)}.degraded{background:#f5a623}.maintenance{background:#8b5cf6}.offline{background:var(--accent-red)}.history{padding:15px 0;border-bottom:1px solid var(--border)}
</style></head><body><main class="status-wrap">
<div class="status-head"><div style="font-size:13px;color:var(--text-dim);letter-spacing:2px">SERVICE STATUS</div><h1 id="app-name">Loading…</h1><div id="overall" class="badge">Checking</div></div>
<section class="card"><div class="card-header"><div class="card-title">Products</div></div><div id="products"></div></section>
<section class="card"><div class="card-header"><div class="card-title">Incident history</div></div><div id="history"></div></section>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const appId=new URLSearchParams(location.search).get('app');
const fmt=s=>s?new Date(s.replace(' ','T')+'Z').toLocaleString():'—';
async function load(){try{if(!appId)throw new Error('Missing app ID');const r=await fetch(`/api/status/${encodeURIComponent(appId)}`);const d=await r.json();if(!r.ok)throw new Error(d.detail||'Unavailable');document.title=`${d.app.name} Status`;document.getElementById('app-name').textContent=d.app.name;const o=document.getElementById('overall');o.textContent=d.overall_status.toUpperCase();o.innerHTML=`<span class="dot ${esc(d.overall_status)}"></span>${esc(d.overall_status.toUpperCase())}`;document.getElementById('products').innerHTML=d.products.length?d.products.map(p=>`<div class="service"><div><strong>${esc(p.name)}</strong><div style="color:var(--text-dim);font-size:12px">${esc(p.status_message||p.level)}</div></div><div><span class="dot ${esc(p.service_status)}"></span>${esc(p.service_status)}</div></div>`).join(''):'<div class="empty">No products listed.</div>';document.getElementById('history').innerHTML=d.history.length?d.history.map(h=>`<div class="history"><div style="display:flex;justify-content:space-between"><strong>${esc(h.product_name||d.app.name)}</strong><span><span class="dot ${esc(h.service_status)}"></span>${esc(h.service_status)}</span></div><div style="color:var(--text2);margin-top:5px">${esc(h.public_message||'Status updated')}</div><div style="color:var(--text-dim);font-size:11px;margin-top:5px">${fmt(h.created_at)}${h.compensation_seconds?` · ${Math.round(h.compensation_seconds/3600)}h compensation`:''}</div></div>`).join(''):'<div class="empty">No incidents reported.</div>';}catch(e){document.getElementById('app-name').textContent='Status unavailable';document.getElementById('products').textContent=e.message;}}
load();setInterval(load,60000);
</script></body></html>
