<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnAuth — Logs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Activity Logs</div>
    </div>
    <div class="content">
      <!-- Filters -->
      <div class="toolbar">
        <input class="input" id="f-key" placeholder="🔍 License key…" style="max-width:200px">
        <select class="select" id="f-action" style="max-width:160px">
          <option value="">All Actions</option>
          <option value="init">Init</option>
          <option value="init_outdated">Init Outdated</option>
          <option value="login">Login</option>
          <option value="login_fail">Login Fail</option>
          <option value="login_banned">Login Banned</option>
          <option value="login_expired">Login Expired</option>
          <option value="login_hwid_limit">HWID Limit</option>
          <option value="logout">Logout</option>
          <option value="ban">Ban</option>
          <option value="heartbeat_fail">Heartbeat Fail</option>
        </select>
        <input class="input" id="f-from" type="date" style="max-width:160px">
        <input class="input" id="f-to"   type="date" style="max-width:160px">
        <button class="btn btn-primary" onclick="load()">Search</button>
        <button class="btn btn-ghost" onclick="clearFilters()">Clear</button>
        <div class="toolbar-spacer"></div>
        <button class="btn btn-outline" onclick="exportLogs()">Export CSV</button>
        <button class="btn btn-danger" onclick="clearAllLogs()">🗑 Clear All Logs</button>
      </div>

      <div class="card" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Timestamp</th><th>Action</th><th>License Key</th>
              <th>IP</th><th>HWID</th><th>Details</th>
            </tr></thead>
            <tbody id="tbody">
              <tr class="loading-row"><td colspan="6"><span class="spinner"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();
  buildSidebar("logs");

  const actionColors = {
    login:    "badge-active",
    logout:   "badge-expired",
    init:     "",
    ban:      "badge-banned",
  };

  function getColor(a) {
    if (a === "login") return "badge-active";
    if (a.includes("fail") || a.includes("banned") || a === "ban") return "badge-banned";
    if (a.includes("expired") || a === "logout") return "badge-expired";
    if (a.includes("outdated") || a.includes("hwid_limit")) return "badge-mod";
    return "";
  }

  async function load() {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = `<tr class="loading-row"><td colspan="6"><span class="spinner"></span></td></tr>`;
    try {
      const rows = await API.getLogs({
        license_key: document.getElementById("f-key").value,
        action:      document.getElementById("f-action").value,
        date_from:   document.getElementById("f-from").value,
        date_to:     document.getElementById("f-to").value ? document.getElementById("f-to").value + " 23:59:59" : "",
        limit: 500,
      });
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No logs found</div></div></td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td style="font-size:12px;color:var(--text2);white-space:nowrap">${fmtDate(r.timestamp)}</td>
          <td><span class="badge ${getColor(r.action)}">${r.action}</span></td>
          <td class="mono" style="font-size:12px">${r.license_key || "—"}</td>
          <td class="mono" style="font-size:12px">${r.ip || "—"}</td>
          <td class="mono" style="font-size:11px;color:var(--text3)" title="${r.hwid || ''}">${r.hwid ? r.hwid.slice(0,12)+'…' : '—'}</td>
          <td style="color:var(--text2);font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.details || "—"}</td>
        </tr>`).join("");
    } catch (e) { toast(e.message, "error"); }
  }

  function clearFilters() {
    ["f-key","f-action","f-from","f-to"].forEach(id => document.getElementById(id).value = "");
    load();
  }

  async function clearAllLogs() {
    if (!confirm("Permanently delete ALL activity logs? This cannot be undone.")) return;
    try {
      await API.clearLogs();
      toast("All logs cleared", "warning");
      load();
    } catch (e) { toast(e.message, "error"); }
  }

  async function exportLogs() {
    try {
      const res = await API.exportLogs({
        license_key: document.getElementById("f-key").value,
        action: document.getElementById("f-action").value,
        date_from: document.getElementById("f-from").value,
        date_to: document.getElementById("f-to").value ? document.getElementById("f-to").value + " 23:59:59" : "",
      });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "logs.csv";
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      toast(e.message, "error");
    }
  }

  load();
</script>
</body>
</html>
