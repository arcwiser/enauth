<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EnAuth — Server Variables</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <div class="topbar-title">Server Variables & Config</div>
      </div>
      <div class="content">
        <div class="toolbar">
          <div class="toolbar-spacer"></div>
          <button class="btn btn-primary" onclick="openModal('create-modal')">+ Set Variable</button>
        </div>

        <div class="card" style="padding:0">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Variable Name</th>
                  <th>Value</th>
                  <th>Type</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="vars-list">
                <tr class="loading-row"><td colspan="5"><span class="spinner"></span></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Variable Modal -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Set Server Variable</div>
        <button class="modal-close" onclick="closeModal('create-modal')">✕</button>
      </div>
      <form id="var-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Key Name</label>
            <input class="input" type="text" id="var-name" placeholder="e.g. motd_message" required>
          </div>
          <div class="form-group">
            <label class="form-label">Value</label>
            <textarea class="input" id="var-value" rows="3" placeholder="Configuration data or message..." required></textarea>
          </div>
          <div class="form-group">
            <label class="checkbox-row">
              <input type="checkbox" id="var-secret">
              Is Secret? (Not returned in public endpoints)
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal('create-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Variable</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireOwner();
    buildSidebar("variables");

    async function loadVars() {
      try {
        const vars = await API.getVariables();
        const list = document.getElementById("vars-list");
        if (vars.length === 0) {
          list.innerHTML = '<tr><td colspan="5"><div class="empty"><div class="empty-icon">🧪</div><div class="empty-text">No variables configured</div></div></td></tr>';
          return;
        }

        list.innerHTML = vars.map(v => `
          <tr>
            <td><strong>${v.name}</strong></td>
            <td><code>${v.value}</code></td>
            <td>${v.is_secret ? '<span class="badge badge-banned">Secret</span>' : '<span class="badge badge-active">Public</span>'}</td>
            <td style="color:var(--text3);font-size:12px">${fmtDate(v.created_at)}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="deleteVar('${v.name}')">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        toast(err.message, "error");
      }
    }

    document.getElementById("var-form").onsubmit = async (e) => {
      e.preventDefault();
      const n = document.getElementById("var-name").value;
      const v = document.getElementById("var-value").value;
      const s = document.getElementById("var-secret").checked;
      
      try {
        await API.setVariable({ name: n, value: v, is_secret: s });
        toast("Variable saved", "success");
        closeModal("create-modal");
        loadVars();
        e.target.reset();
      } catch (err) {
        toast(err.message, "error");
      }
    };

    async function deleteVar(name) {
      if (!confirm(`Delete variable ${name}?`)) return;
      try {
        await API.deleteVariable(name);
        toast("Variable deleted", "success");
        loadVars();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    loadVars();
  </script>
</body>
</html>
