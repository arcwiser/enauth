<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnAuth — Customer requests</title><link rel="stylesheet" href="css/style.css"><style>.request-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.request-card{border:1px solid var(--border);border-radius:12px;padding:18px;background:var(--bg2)}.request-card p{color:var(--text2);min-height:38px}.request-meta{font-size:11px;color:var(--text3);line-height:1.7}.request-actions{display:flex;gap:8px;margin-top:14px}</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main"><div class="topbar"><div class="topbar-title">Customer requests</div><button class="btn btn-outline" onclick="loadRequests()">Refresh</button></div><div class="content"><div class="card" style="margin-bottom:16px"><div class="toolbar"><div><div class="card-title">HWID reset review</div><p style="color:var(--text2);margin:5px 0 0">Approving removes registered devices and active sessions for that customer.</p></div><div class="toolbar-spacer"></div><select class="input" id="status-filter" style="width:160px" onchange="loadRequests()"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="all">All requests</option></select></div></div><div id="request-grid" class="request-grid"><span class="spinner"></span></div></div></div></div><script src="js/api.js"></script><script>
requireAuth();buildSidebar('requests');
async function review(id,decision){if(!confirm(`${decision==='approve'?'Approve and reset all registered devices':'Reject'} this request?`))return;try{await API.reviewHwidResetRequest(id,decision);toast(`Request ${decision}d`,'success');await loadRequests()}catch(e){toast(e.message,'error')}}
async function loadRequests(){const box=document.getElementById('request-grid');box.innerHTML='<span class="spinner"></span>';try{const rows=await API.getHwidResetRequests(document.getElementById('status-filter').value);box.innerHTML=rows.length?rows.map(x=>`<article class="request-card"><div style="display:flex;justify-content:space-between;gap:12px"><strong>${escapeHtml(x.client_username||'Customer')}</strong>${statusBadge(x.status)}</div><p>${escapeHtml(x.reason||'No reason supplied.')}</p><div class="request-meta"><div>Application: ${escapeHtml(x.app_name)}</div><div>License: <span class="mono">${escapeHtml(x.key)}</span></div><div>Requested: ${fmtDate(x.created_at)}</div>${x.reviewed_at?`<div>Reviewed: ${fmtDate(x.reviewed_at)}</div>`:''}</div>${x.status==='pending'?`<div class="request-actions"><button class="btn btn-primary btn-sm" onclick="review('${x.id}','approve')">Approve reset</button><button class="btn btn-danger btn-sm" onclick="review('${x.id}','reject')">Reject</button></div>`:''}</article>`).join(''):'<div class="card"><div class="empty"><div class="empty-icon">✓</div><div class="empty-text">No requests in this queue</div></div></div>'}catch(e){box.innerHTML=`<div class="card" style="color:var(--accent-red)">${escapeHtml(e.message)}</div>`}}loadRequests();
</script></body></html>
