<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnAuth — Server health</title><link rel="stylesheet" href="css/style.css"><style>.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.health-card{padding:18px;border:1px solid var(--border);border-radius:12px;background:var(--bg2)}.health-card strong{display:block;font-size:25px;margin:8px 0}.ok{color:#22c55e}.warn{color:#f59e0b}.bad{color:#ef4444}</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main"><div class="topbar"><div class="topbar-title">Server health</div><button class="btn btn-outline" onclick="loadHealth()">Refresh</button></div><div class="content"><div class="card" style="margin-bottom:16px"><div class="card-title">Live operational status</div><p style="color:var(--text2);margin-bottom:0">Measured inside EnAuth. Refreshes every 20 seconds without exposing private host details.</p></div><div class="health-grid" id="health-grid"><span class="spinner"></span></div></div></div></div><script src="js/api.js"></script><script>
requireAuth();buildSidebar('health');const safe=escapeHtml;function card(label,value,detail,state='ok'){return `<div class="health-card"><span>${safe(label)}</span><strong class="${state}">${safe(String(value))}</strong><small>${safe(detail||'')}</small></div>`}async function loadHealth(){try{const h=await API.getOperationsHealth(),r=h.runtime||{},d=h.database||{},disk=h.disk||{},b=h.backups||{},bot=h.discord_bot||{},s=h.signing_key||{},c=h.certificate||{};const pct=Number(disk.percent_used||0),err=Number(r.error_rate_percent||0);document.getElementById('health-grid').innerHTML=[card('API requests',r.requests||0,`Uptime ${Math.round((r.uptime_seconds||0)/60)} min`),card('Average response',`${r.average_latency_ms||0} ms`,`P95 ${r.p95_latency_ms||0} ms`,(r.p95_latency_ms||0)>1000?'warn':'ok'),card('Error rate',`${err}%`,`${r.server_errors||0} server errors`,err>5?'bad':err>1?'warn':'ok'),card('Database',`${d.latency_ms||0} ms`,'SQLite response time',(d.latency_ms||0)>100?'warn':'ok'),card('Disk usage',`${pct}%`,`${disk.free_gb||0} GB free`,pct>90?'bad':pct>80?'warn':'ok'),card('Latest backup',b.latest_age_hours==null?'Missing':`${b.latest_age_hours}h ago`,`${b.count||0} snapshots`,b.latest_age_hours==null||b.latest_age_hours>48?'bad':b.latest_age_hours>24?'warn':'ok'),card('Discord bot',bot.status||'Unknown',bot.last_seen||'No heartbeat',bot.status==='healthy'?'ok':'warn'),card('Signing key',s.status||'Unknown',s.key_id||'',s.status==='healthy'?'ok':'bad'),card('TLS certificate',c.days_remaining==null?(c.status||'Not configured'):`${c.days_remaining} days`,c.expires_at||'',c.days_remaining!=null&&c.days_remaining<14?'bad':c.days_remaining!=null&&c.days_remaining<30?'warn':'ok')].join('')}catch(e){document.getElementById('health-grid').innerHTML=card('Monitoring unavailable','Error',e.message,'bad')}}loadHealth();setInterval(loadHealth,20000);
</script></body></html>
