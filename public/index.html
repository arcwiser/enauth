<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnAuth - Sign In</title>
  <meta name="description" content="EnAuth authentication">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, rgba(0, 242, 255, 0.14), transparent 30%),
        linear-gradient(180deg, #06080d, #0b1017 60%, #05070a 100%);
    }
    .login-box { width: 100%; max-width: 470px; }
    .panel-note {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-dim);
    }
    .auth-error, .auth-success {
      display: none;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.4;
    }
    .auth-error {
      color: var(--accent-red);
      border: 1px solid rgba(255, 62, 62, 0.2);
      background: rgba(255, 62, 62, 0.08);
    }
    .auth-success {
      color: var(--accent-green);
      border: 1px solid rgba(0, 255, 136, 0.2);
      background: rgba(0, 255, 136, 0.08);
    }
    .helper-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .helper-row .btn { flex: 1; justify-content: center; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">E</div>
      <div class="logo-text">ENAUTH</div>
    </div>
    <p class="login-subtitle" id="login-subtitle">Admin Sign In</p>

    <div class="auth-error" id="login-error"></div>
    <div class="auth-success" id="login-success"></div>

    <form id="login-form" autocomplete="off">
      <div id="credentials-fields">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="input" id="username" type="text" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group" style="margin-bottom:18px">
          <label class="form-label" for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="Enter password" required>
        </div>
        <button class="btn btn-primary" type="submit" id="login-btn" style="width:100%; justify-content:center;">Sign In</button>
        <div class="helper-row">
          <button class="btn btn-secondary" type="button" id="reseller-btn">Reseller Sign In</button>
        </div>
      </div>

      <div id="twofactor-fields" style="display:none;">
        <div class="form-group" style="margin-bottom:20px">
          <label class="form-label" style="text-align:center; display:block">Google Authenticator Passcode</label>
          <input class="input mono" id="twofactor-code" type="text" placeholder="000000" pattern="[0-9]*" inputmode="numeric" maxlength="6" style="font-size:24px; text-align:center; letter-spacing:8px; padding:10px 0" autocomplete="one-time-code">
          <p class="panel-note" style="text-align:center;">Enter the 6-digit code from your authenticator app.</p>
        </div>
        <button class="btn btn-primary" type="button" id="twofactor-btn" style="width:100%; justify-content:center;">Verify & Authenticate</button>
        <button class="btn btn-ghost" type="button" id="back-btn" style="width:100%; margin-top:10px;">Back to Sign In</button>
      </div>
    </form>
  </div>
</div>

<script>
  const API_BASE = (() => {
    const origin = window.location.origin || "";
    if (origin && origin !== "null") return origin;
    return localStorage.getItem("enauth_base_url") || "http://127.0.0.1:8080";
  })();

  const state = { tempToken: null };

  function $id(id) { return document.getElementById(id); }
  function showError(message) {
    const box = $id("login-error");
    box.textContent = message;
    box.style.display = "block";
    $id("login-success").style.display = "none";
  }
  function showSuccess(message) {
    const box = $id("login-success");
    box.textContent = message;
    box.style.display = "block";
    $id("login-error").style.display = "none";
  }
  function clearAlerts() {
    $id("login-error").style.display = "none";
    $id("login-success").style.display = "none";
  }
  function setBusy(button, busy, text) {
    button.disabled = busy;
    button.innerHTML = busy ? '<span class="spinner"></span> ' + text : text;
  }
  function saveUser(user) {
    localStorage.setItem("enauth_user", JSON.stringify(user));
  }
  function getToken() {
    return localStorage.getItem("enauth_user");
  }
  function getResellerToken() {
    return localStorage.getItem("enauth_reseller_token");
  }
  async function requestJson(path, body = null, method = "POST", token = null) {
    const options = {
      method,
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json",
      },
    };
    if (body !== null && method !== "GET" && method !== "HEAD") {
      options.body = JSON.stringify(body);
    }
    const res = await fetch(API_BASE + path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || data.message || `HTTP ${res.status}`);
    return data;
  }
  async function authMe(token) {
    return requestJson("/api/admin/auth/me", null, "GET", token);
  }
  async function authSignin(username, password) {
    return requestJson("/api/admin/auth/login", { username, password });
  }
  async function authVerify2FA(temp_token, code) {
    return requestJson("/api/admin/auth/2fa/verify", { temp_token, code });
  }

  function applyMode() {
    clearAlerts();
    $id("login-subtitle").textContent = "Admin Sign In";
    $id("login-btn").textContent = "Sign In";
  }

  function show2FA() {
    $id("login-subtitle").textContent = "Two-Factor Verification";
    $id("credentials-fields").style.display = "none";
    $id("twofactor-fields").style.display = "block";
    $id("twofactor-code").value = "";
    $id("twofactor-code").focus();
  }

  function hide2FA() {
    state.tempToken = null;
    $id("credentials-fields").style.display = "block";
    $id("twofactor-fields").style.display = "none";
    applyMode();
  }

  async function handleSubmit(event) {
    event.preventDefault();
    clearAlerts();
    const button = $id("login-btn");
    const username = $id("username").value.trim();
    const password = $id("password").value;
    if (!username || !password) {
      showError("Please enter both username and password.");
      return;
    }

    setBusy(button, true, "Signing in...");
    try {
      const res = await authSignin(username, password);
      if (res.two_factor_required) {
        state.tempToken = res.temp_token;
        show2FA();
        return;
      }

      const me = await authMe().catch(() => ({}));
      saveUser({ id: me.id, username: res.username, role: res.role || "user" });
      window.location.href = "dashboard.html";
    } catch (err) {
      showError(err.message || "Login failed");
    } finally {
      setBusy(button, false, "Sign In");
      if (!state.tempToken) applyMode();
    }
  }

  async function handle2FA() {
    const button = $id("twofactor-btn");
    const code = $id("twofactor-code").value.trim();
    if (code.length !== 6) {
      showError("Please enter a 6-digit code.");
      return;
    }

    clearAlerts();
    setBusy(button, true, "Verifying...");
    try {
      const res = await authVerify2FA(state.tempToken, code);
      const me = await authMe().catch(() => ({}));
      saveUser({ id: me.id, username: res.username, role: res.role || "user" });
      window.location.href = "dashboard.html";
    } catch (err) {
      showError(err.message || "Verification failed");
      setBusy(button, false, "Verify & Authenticate");
    }
  }

  async function init() {
    if (getToken()) {
      try {
        await authMe(getToken());
        window.location.href = "dashboard.html";
        return;
      } catch {
        localStorage.removeItem("enauth_user");
      }
    }

    if (getResellerToken()) {
      window.location.href = "reseller.html";
      return;
    }

    $id("login-form").addEventListener("submit", handleSubmit);
    $id("twofactor-btn").addEventListener("click", handle2FA);
    $id("back-btn").addEventListener("click", hide2FA);
    $id("reseller-btn").addEventListener("click", () => {
      window.location.href = "reseller.html";
    });

    applyMode();
  }

  init();
</script>
</body>
</html>
